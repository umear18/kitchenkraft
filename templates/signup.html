<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up — Kitchen Kraft</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo">🍳&nbsp;<span class="kitchen">Kitchen</span>&nbsp;<span class="kraft">Kraft</span></div>
    <p class="auth-sub">Create your account to get started.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="field">
        <label>Name</label>
        <input type="text" name="name" placeholder="Your name" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="At least 6 characters" required minlength="6">
      </div>
      <div class="field">
        <label>Food Preference</label>
        <select name="food_preference">
          <option value="Veg">Vegetarian</option>
          <option value="Non-Veg">Non-Vegetarian</option>
          <option value="Eggetarian">Eggetarian</option>
        </select>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
</body>
</html>
